                    { id: 73, q: "Câu 8. Nội dung nào sau đây phản ánh không đúng triển vọng của Cộng đồng ASEAN?", opts: ["Mức độ liên kết chính trị - an ninh, kinh tế, văn hóa - xã hội.", "Thể chế, chính sách và cơ chế hợp tác của Cộng đồng ASEAN.", "Vị thế ngày càng được nâng cao trên trường quốc tế.", "Sự đa dạng về chế độ chính trị, sự thay đổi cấu trúc địa chính trị."], ans: 3 },
                    { id: 74, q: "Câu 9. Cộng đồng ASEAN ra đời không nhằm mục tiêu nào sau đây?", opts: ["Liên minh quân sự chặt chẽ.", "Liên kết về chính trị - an ninh.", "Liên kết về văn hóa - xã hội.", "Liên kết về kinh tế."], ans: 0 },
                    { id: 75, q: "Câu 10. Nội dung nào sau đây không phản ánh triển vọng của Cộng đồng ASEAN?", opts: ["Vị thế của Cộng đồng ASEAN ngày càng quan trọng trên thế giới.", "Cơ chế hợp tác giữa các nước ASEAN ngày càng hoàn thiện.", "Các nước ASEAN ngày càng liên kết chặt chẽ trên nhiều lĩnh vực.", "Các nước Đông Nam Á có cùng thể chế chính trị."], ans: 3 }
                ]
            }
        ];

        const userAnswers = {};

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            const grid = document.getElementById('question-grid');
            container.innerHTML = '';
            grid.innerHTML = '';

            let globalIndex = 1;

            lessonsData.forEach(lesson => {
                const lessonDiv = document.createElement('div');
                lessonDiv.className = 'space-y-4';
                
                const headerTitle = document.createElement('h2');
                headerTitle.className = 'text-xl font-bold text-blue-800 bg-blue-50 p-4 rounded-xl border-l-4 border-blue-600 shadow-sm';
                headerTitle.innerText = lesson.lessonName;
                lessonDiv.appendChild(headerTitle);

                lesson.questions.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'bg-white p-6 rounded-2xl shadow-md';
                    card.id = `q-card-${item.id}`;
                    
                    let html = `
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full">${lesson.lessonName}</span>
                            <span class="text-xs text-slate-400 font-medium">Câu ${globalIndex}</span>
                        </div>
                        <h3 class="font-semibold text-slate-800 mb-4 text-base">${item.q}</h3>
                        <div class="space-y-2" id="options-${item.id}">
                    `;

                    item.opts.forEach((opt, optIdx) => {
                        html += `
                            <label class="flex items-start p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition" id="lbl-${item.id}-${optIdx}">
                                <input type="radio" name="question-${item.id}" value="${optIdx}" onchange="selectAnswer(${item.id}, ${optIdx})" class="mt-1 mr-3">
                                <span class="text-sm text-slate-700">${String.fromCharCode(65 + optIdx)}. ${opt}</span>
                            </label>
                        `;
                    });

                    html += `</div>`;
                    card.innerHTML = html;
                    lessonDiv.appendChild(card);

                    // Grid Button
                    const gridBtn = document.createElement('button');
                    gridBtn.className = 'w-10 h-10 rounded-lg font-semibold text-sm bg-slate-200 text-slate-700 flex items-center justify-center transition hover:bg-slate-300';
                    gridBtn.id = `grid-btn-${item.id}`;
                    gridBtn.innerText = globalIndex;
                    gridBtn.onclick = () => {
                        document.getElementById(`q-card-${item.id}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
                    };
                    grid.appendChild(gridBtn);

                    globalIndex++;
                });

                container.appendChild(lessonDiv);
            });
        }

        function selectAnswer(qId, optIdx) {
            userAnswers[qId] = optIdx;
            const gridBtn = document.getElementById(`grid-btn-${qId}`);
            gridBtn.className = 'w-10 h-10 rounded-lg font-semibold text-sm bg-blue-500 text-white flex items-center justify-center transition shadow';
        }

        function toggleGrid() {
            const grid = document.getElementById('question-grid');
            grid.classList.toggle('hidden');
        }

        function submitQuiz() {
            let score = 0;
            let total = 0;

            lessonsData.forEach(lesson => {
                lesson.questions.forEach(item => {
                    total++;
                    const userAns = userAnswers[item.id];
                    const gridBtn = document.getElementById(`grid-btn-${item.id}`);
                    
                    // Reset styles
                    for (let i = 0; i < item.opts.length; i++) {
                        const lbl = document.getElementById(`lbl-${item.id}-${i}`);
                        lbl.className = 'flex items-start p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition';
                    }

                    if (userAns !== undefined) {
                        if (userAns === item.ans) {
                            score++;
                            gridBtn.className = 'w-10 h-10 rounded-lg font-semibold text-sm bg-green-500 text-white flex items-center justify-center transition shadow';
                            document.getElementById(`lbl-${item.id}-${userAns}`).className += ' correct-answer';
                        } else {
                            gridBtn.className = 'w-10 h-10 rounded-lg font-semibold text-sm bg-red-500 text-white flex items-center justify-center transition shadow';
                            document.getElementById(`lbl-${item.id}-${userAns}`).className += ' incorrect-answer';
                            document.getElementById(`lbl-${item.id}-${item.ans}`).className += ' correct-answer';
                        }
                    } else {
                        gridBtn.className = 'w-10 h-10 rounded-lg font-semibold text-sm bg-slate-300 text-slate-500 flex items-center justify-center transition';
                        document.getElementById(`lbl-${item.id}-${item.ans}`).className += ' correct-answer';
                    }
                });
            });

            document.getElementById('score-display').innerText = `Kết quả: ${score} / ${total} câu đúng`;
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
